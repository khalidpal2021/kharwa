<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF8" />
  <meta name="description" content="Kharwa — a prayer tracker for two." />
  <title>Kharwa</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FAFAF8'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23B8860B' stroke-width='2'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ------------------------------------------------- who's this? ------- -->
  <section id="gate" class="gate" hidden>
    <div class="gate-inner">
      <p class="wordmark wordmark--gate">Kharwa</p>
      <h1 class="gate-title">Who&rsquo;s this?</h1>
      <p class="gate-sub">We&rsquo;ll remember on this device.</p>
      <div class="gate-buttons">
        <button class="gate-btn" type="button" data-person="khalid">Khalid</button>
        <button class="gate-btn" type="button" data-person="marwa">Marwa</button>
      </div>
    </div>
  </section>

  <!-- ---------------------------------------------------------- app ------- -->
  <div id="app" class="app" hidden>

    <!-- ------------------------------------------------------ masthead --- -->
    <header class="masthead">
      <p class="wordmark">Kharwa</p>
      <div class="masthead-dates">
        <p id="gregorian" class="greg">&nbsp;</p>
        <p id="hijri" class="hijri">&nbsp;</p>
      </div>
      <button id="settings-open" class="btn btn--ghost masthead-settings" type="button" aria-label="Settings">
        <svg class="gear" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M19.4 13.9a7.6 7.6 0 0 0 0-3.8l2-1.2-2-3.4-2.1 1a7.7 7.7 0 0 0-3.3-1.9L13.7 2h-3.4l-.3 2.6a7.7 7.7 0 0 0-3.3 1.9l-2.1-1-2 3.4 2 1.2a7.6 7.6 0 0 0 0 3.8l-2 1.2 2 3.4 2.1-1a7.7 7.7 0 0 0 3.3 1.9l.3 2.6h3.4l.3-2.6a7.7 7.7 0 0 0 3.3-1.9l2.1 1 2-3.4z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span class="settings-text">Settings</span>
      </button>
    </header>

    <!-- --------------------------------------------------- next prayer --- -->
    <section class="hero" aria-labelledby="next-name">
      <div class="hero-line">
        <p class="hero-label">Next prayer</p>
        <h1 id="next-name" class="hero-name">&nbsp;</h1>
        <p class="hero-meta">
          <span id="next-until" class="hero-until"></span>
          <span id="next-time" class="hero-time"></span>
        </p>
      </div>
    </section>

    <div id="timeline" class="timeline" aria-hidden="true"></div>

    <!-- -------------------------------------------------------- columns --- -->
    <div class="columns">

      <!-- ------------------------------------------------------- today --- -->
      <section class="col col--today" aria-labelledby="today-label">
        <div class="seclabel">
          <span class="rule rule--short" aria-hidden="true"></span>
          <h2 id="today-label" class="seclabel-text">Today</h2>
          <span class="rule rule--grow" aria-hidden="true"></span>
          <nav class="daynav" aria-label="Day navigation">
            <button id="day-prev" class="daynav-btn" type="button" aria-label="Previous day">&lsaquo;</button>
            <span id="day-label" class="daynav-label"></span>
            <button id="day-next" class="daynav-btn" type="button" aria-label="Next day">&rsaquo;</button>
          </nav>
        </div>

        <button id="day-today" class="btn btn--ghost daynav-today" type="button" hidden>Back to today</button>

        <div class="tt-head" aria-hidden="true">
          <span></span>
          <span class="tt-head-time">Time</span>
          <span id="head-khalid"></span>
          <span id="head-marwa"></span>
        </div>

        <ol id="timetable" class="timetable"></ol>
      </section>

      <!-- -------------------------------------------------------- week --- -->
      <section class="col col--week" aria-labelledby="week-label">
        <div class="seclabel">
          <span class="rule rule--short" aria-hidden="true"></span>
          <h2 id="week-label" class="seclabel-text">This week</h2>
          <span class="rule rule--grow" aria-hidden="true"></span>
        </div>

        <div id="week" class="week"></div>
      </section>

    </div>

    <!-- ----------------------------------------------------- settings --- -->
    <div id="settings" class="sheet" hidden>
      <div id="settings-scrim" class="sheet-scrim"></div>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="sheet-head">
          <h2 id="settings-title" class="sheet-title">Settings</h2>
          <button id="settings-close" class="btn btn--ghost" type="button">Close</button>
        </div>

        <p id="settings-who" class="sheet-who"></p>

        <label class="field">
          <span class="field-label">Display name</span>
          <input id="set-name" class="input" type="text" autocomplete="off" maxlength="40" />
        </label>

        <p class="sheet-note">
          Prayer times follow the Islamic Society of Tracy&rsquo;s published
          timetable, so there is nothing to configure here.
        </p>

        <button id="set-save" class="btn btn--primary" type="button">Save settings</button>
        <p id="set-status" class="sheet-status" role="status"></p>

        <hr class="rule rule--full" />

        <button id="switch-person" class="btn btn--ghost btn--block" type="button">Switch person</button>
        <p class="sheet-note sheet-note--center">Forgets who you are on this device and asks again.</p>
      </div>
    </div>

    <p id="banner" class="banner" hidden></p>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/adhan@4.4.3/lib/bundles/adhan.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <script src="js/timetable.js" defer></script>
  <script src="js/times.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
